<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sour Flour OS — Executive Slide Deck</title>
  <style>
    :root {
      --ink: #122826;
      --forest: #173f3c;
      --moss: #28615d;
      --deep: #0e2422;
      --cream: #f6f1e6;
      --paper: #fbf8f2;
      --gold: #c4923a;
      --wheat: #ffe0a5;
      --muted: #5c6b67;
      --line: #d8e0dc;
      --ok: #1f7a48;
      --warn: #b86a14;
      --crit: #9b2c2c;
      --info: #1a5f7a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--deep); color: var(--ink); }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #deck { height: 100%; width: 100%; position: relative; }
    .slide {
      display: none;
      height: 100%;
      padding: 36px 56px 72px;
      background: var(--paper);
      flex-direction: column;
    }
    .slide.is-on { display: flex; }
    .slide.dark {
      background: var(--forest);
      color: #f4efe4;
    }
    .slide.dark .muted, .slide.dark .lead { color: #d5e4df; }
    .kicker {
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 750;
      color: var(--gold);
      margin: 0 0 8px;
    }
    h1, h2, h3 { font-family: Georgia, "Iowan Old Style", Palatino, serif; font-weight: 600; margin: 0; }
    h1 { font-size: clamp(42px, 5.4vw, 68px); line-height: 1.05; }
    h2 { font-size: clamp(28px, 3.4vw, 42px); line-height: 1.12; color: var(--forest); }
    .slide.dark h2 { color: #fff; }
    .lead { font-size: 20px; line-height: 1.45; max-width: 860px; color: var(--muted); margin: 14px 0 0; }
    .grid { display: grid; gap: 14px; margin-top: 22px; }
    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .slide.dark .card { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); color: #f4efe4; }
    .card h3 { font-size: 18px; color: var(--forest); margin-bottom: 6px; }
    .slide.dark .card h3 { color: var(--wheat); }
    .card p, .card li, .bullets li { font-size: 15px; line-height: 1.45; color: var(--ink); }
    .slide.dark .card p, .slide.dark .card li { color: #e8efe9; }
    .bullets { margin: 18px 0 0; padding-left: 20px; }
    .bullets li { margin: 8px 0; }
    .steps { counter-reset: step; margin-top: 16px; display: grid; gap: 10px; }
    .step {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      align-items: start;
    }
    .step::before {
      counter-increment: step;
      content: counter(step);
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--forest);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 750; font-size: 14px;
    }
    .step strong { display: block; font-size: 16px; }
    .step span { color: var(--muted); font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
    th { text-align: left; background: var(--forest); color: #fff; padding: 8px 10px; font-weight: 650; }
    td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .loop {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; align-items: center;
    }
    .loop span {
      background: #fff; border: 1px solid var(--line); border-radius: 999px;
      padding: 8px 12px; font-size: 13px; font-weight: 650;
    }
    .loop i { color: var(--gold); font-style: normal; font-weight: 800; }
    .callout {
      margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--gold);
      background: #fff8e9; color: #5f4d2d; border-radius: 0 8px 8px 0;
    }
    .slide.dark .callout { background: rgba(255,224,165,.12); color: var(--wheat); border-left-color: var(--wheat); }
    .meta { display: flex; gap: 18px; margin-top: 22px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
    .who { font-size: 13px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; color: var(--moss); }
    .rule { margin-top: 14px; font-size: 14px; color: var(--forest); font-weight: 650; }
    #chrome {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px; background: var(--deep); color: #dcece9; font-size: 13px; z-index: 5;
    }
    #chrome button {
      background: transparent; color: #ffe0a5; border: 1px solid #3d5c58;
      border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit;
    }
    #progress { position: absolute; left: 0; right: 0; bottom: 42px; height: 3px; background: #23403d; }
    #progress > i { display: block; height: 100%; background: var(--gold); width: 0; }
    #overview {
      display: none; position: fixed; inset: 0; background: rgba(14,36,34,.96);
      z-index: 8; padding: 28px; overflow: auto; color: #fff;
    }
    #overview.is-on { display: block; }
    #overview h2 { color: #fff; margin-bottom: 16px; }
    .ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .ov-item {
      background: #1b3a37; border: 1px solid #2f5550; border-radius: 8px;
      padding: 10px; cursor: pointer; min-height: 86px;
    }
    .ov-item small { display: block; color: var(--wheat); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .ov-item b { display: block; margin-top: 6px; font-size: 14px; font-weight: 650; }
    .title-meta { margin-top: 28px; font-size: 16px; color: #d5e4df; }
    .tiny { font-size: 13px; color: var(--muted); }
    @media (max-width: 900px) {
      .slide { padding: 22px 18px 70px; }
      .g2, .g3, .g4 { grid-template-columns: 1fr; }
      h1 { font-size: 36px; }
      h2 { font-size: 26px; }
    }
    @media print {
      body { overflow: visible; background: #fff; }
      #chrome, #progress, #overview { display: none !important; }
      .slide { display: flex !important; page-break-after: always; height: auto; min-height: 100vh; }
    }
  </style>
</head>
<body>
  <div id="deck"></div>
  <div id="progress"><i></i></div>
  <div id="overview"></div>
  <nav id="chrome">
    <div id="chapterLabel">Sour Flour OS</div>
    <div>
      <button type="button" data-act="prev">Prev</button>
      <span id="count">1 / 1</span>
      <button type="button" data-act="next">Next</button>
      <button type="button" data-act="overview">Chapters</button>
    </div>
  </nav>
  <script>
    const S = [
      { ch: "Opening", dark: true, kicker: "Sour Flour Bakery", title: "Sour Flour OS", lead: "The operating system for one wholesale bakery day — from standing demand through bake, pack, route, delivery, invoice, and closeout.", extra: '<p class="title-meta">Executive briefing · August 2026<br>Canonical product: Bakery Manager · Flat PHP + MariaDB · DreamHost</p>' },
      { ch: "Opening", kicker: "How to use this deck", title: "A chaptered walkthrough, not a feature list", lead: "This deck explains the whole system the way the bakery actually works: one operating date, many roles, one continuous loop.", items: [
        "Arrow keys, click, or swipe to move. Press O for the chapter grid. F for fullscreen. Print to PDF if needed.",
        "Chapter openers set the job. Walkthrough slides show who uses the screen, what they see, what they do, and what the system writes.",
        "The live app is bilingual (English / Spanish). Baker and driver screens lean Spanish; administration leans English.",
        "When this deck and the running code disagree, the code wins. The product manual is BAKERY_PRODUCT_CONTEXT.md."
      ]},
      { ch: "Opening", kicker: "Agenda", title: "Seventeen chapters", cards: [
        ["01–03", "What the OS is, who uses it, and the rules that must not break."],
        ["04–08", "The workday spine, then every demand, customer, production, and delivery screen."],
        ["09–12", "Billing, catalog, customer portal, and exception recovery."],
        ["13–17", "Insights, administration, SF Baker, a full-day walkthrough, and honest open loops."]
      ], cols: 2 },

      { ch: "01 Product", dark: true, kicker: "Chapter 01", title: "What Sour Flour OS is", lead: "It runs the physical day of a wholesale bakery. It is not a generic ERP, not a CRM, and not a new module factory." },
      { ch: "01 Product", kicker: "Thesis", title: "One date. Every role. The next action.", lead: "By looking at a single operating date, every role can see what must happen next, do that work, and leave a trustworthy record for the next role.", items: [
        "The mental model is a continuous loop keyed on one date — not a stack of disconnected apps.",
        "The operational spine already exists: Daily Run’s eight gated stages.",
        "The product work is closing loops that still rely on memory — not adding screens.",
        "Dated demand beats standing demand per customer. Historical invoices never use live catalog prices."
      ]},
      { ch: "01 Product", kicker: "The loop", title: "How a bakery day actually moves", extra: '<div class="loop"><span>Standing demand</span><i>→</i><span>Dated orders</span><i>→</i><span>Confirm demand</span><i>→</i><span>Production plan</span><i>→</i><span>Bake</span><i>→</i><span>Pack</span><i>→</i><span>Load</span><i>→</i><span>Deliver</span><i>→</i><span>Returns / waste</span><i>→</i><span>Invoice</span><i>→</i><span>Close the day</span></div><p class="lead">Each arrow is a handoff. If the next role has to remember what happened, that arrow is still open.</p>' },
      { ch: "01 Product", kicker: "Stack", title: "A flat, deployable bakery app", cards: [
        ["Pages", "Server-rendered PHP page scripts. Shared logic lives in includes/. No framework."],
        ["Data", "MariaDB. Migrations in database/schema/ plus scripts/run_migrations.php."],
        ["Clients", "Vanilla JS/CSS. Driver and portal are mobile-first. Staff UI is bilingual."],
        ["Host", "DreamHost. Local/test databases for development. Production only when the owner authorizes."]
      ], cols: 2 },
      { ch: "01 Product", kicker: "Principles", title: "How the OS is supposed to grow", items: [
        "Improve existing workflows before inventing systems. This app already has too many screens.",
        "Prefer closed loops: after a user action, something must carry the work forward.",
        "Surface information where the decision is made. A chip beats a new report.",
        "Normal case silent, unusual case loud. Exceptions drive the day.",
        "No generic ERP feature creep. Every feature must trace to a bakery-day moment."
      ]},

      { ch: "02 Roles", dark: true, kicker: "Chapter 02", title: "Who the OS is for", lead: "Menu hiding is never the only control. Roles are enforced in includes/auth.php." },
      { ch: "02 Roles", kicker: "Access model", title: "Five staff roles, plus the customer", extra: `<table>
        <tr><th>Role</th><th>Home</th><th>Sees</th></tr>
        <tr><td>Administrator</td><td>Operations Dashboard</td><td>Every current module, users, login history, Homebase, historical nav, SF Baker admin</td></tr>
        <tr><td>Manager</td><td>Bakery Manager / Daily Run</td><td>All operational modules. Cannot change users or roles.</td></tr>
        <tr><td>Baker</td><td>Daily Production (tomorrow)</td><td>Daily Production + Pack List, filtered to assigned product lines</td></tr>
        <tr><td>Driver</td><td>My Route</td><td>My Route, Call HQ, Route Closeout for their route</td></tr>
        <tr><td>Driver Assistant</td><td>Paired driver’s My Route</td><td>Same stops and delivery records as the paired driver</td></tr>
        <tr><td>Customer</td><td>Portal home</td><td>Upcoming deliveries, standing order, pauses, invoices, photos, issues</td></tr>
      </table>` },
      { ch: "02 Roles", kicker: "Sign-in", title: "Four-digit codes, then the right home", who: "All staff · login.php", steps: [
        ["Enter the 4-digit staff code.", "CSRF-protected. Idle sessions expire (8h staff / 12h driver)."],
        ["The OS routes by role.", "Drivers go to My Route. Bakers go to tomorrow’s Daily Production. Managers go to the dashboard."],
        ["Managers can enter driver mode without losing their session.", "They pick a driver identity and work that route, then return."]
      ], rule: "Customers use a separate portal login: 4-digit customer code, phone+PIN signup, or a staff-generated QR." },
      { ch: "02 Roles", kicker: "Reference UX", title: "Study the driver before building other roles", lead: "The driver flow is the reference implementation: one next action, mobile-first, transactional confirm, no extra navigation.", items: [
        "Next stop, compact remaining-stop map, navigate, photo, pieces, credits, COD, invoice preview, confirm.",
        "Remaining stops can be reordered on My Route (Go next or compact Adjust).",
        "A Driver Assistant works the paired driver’s route so both update the same stops.",
        "If another role’s screen asks the user to reverse-engineer the day, it is not finished."
      ]},

      { ch: "03 Rules", dark: true, kicker: "Chapter 03", title: "Rules that break the bakery if ignored", lead: "These are operational invariants, not style preferences." },
      { ch: "03 Rules", kicker: "Demand", title: "Dated beats standing — per customer", items: [
        "A customer’s dated order replaces their standing order for that date only. Other customers still fall back to standing.",
        "Standing is a template / forecast. Daily is the commercial commitment. They never rewrite each other.",
        "Generation preserves manually changed dated quantities unless overwrite_changed is set.",
        "Inactive customers and synthetic SF Bakers never generate wholesale demand.",
        "Week pauses, date-range pauses, and skip dates suppress generation and forecast."
      ], callout: "product_distribution.php still flips demand all-or-nothing per date. That is a known bug, not a pattern." },
      { ch: "03 Rules", kicker: "Statuses", title: "Two clocks that must stay consistent", extra: `<table>
        <tr><th>Clock</th><th>Values</th><th>Advances when</th></tr>
        <tr><td>daily_orders.status</td><td>pending → confirmed → in_production → ready → out_for_delivery → delivered → invoiced</td><td>Demand, load, delivery confirm, Billing Center mark</td></tr>
        <tr><td>assignment.delivery_status</td><td>pending → in_transit → delivered / failed / cancelled</td><td>Route work, confirm, skip, failed-stop report</td></tr>
      </table><p class="rule">Known divergence: loading a van can set orders out_for_delivery while assignments stay pending. Skip may cancel the assignment but not the order.</p>` },
      { ch: "03 Rules", kicker: "Goods and money", title: "Custody, snapshots, and invoice identity", items: [
        "Loads move custody, not ownership: available → loaded. Reducing a load returns stock.",
        "Delivery confirmation does not decrement the load. Route closeout does: loaded = delivered + returned + waste.",
        "Confirming a delivery freezes pieces, credits, pricing label, totals, and COD. That snapshot is the bill forever.",
        "Invoice identity is computed: INV-YYYYMMDD-{orderId padded 5}. One invoice per confirmed delivery.",
        "Billing Center marks status invoiced. It does not invent amounts. Never price history from products.price."
      ]},
      { ch: "03 Rules", kicker: "Other invariants", title: "Small facts that keep the day honest", cards: [
        ["Sunday = 7", "Legacy 0 is readable via compat helpers. Use bakery_standing_day_from_date()."],
        ["Zones table wins", "zones.php is source of truth. map.php still has a hardcoded list — prefer the table."],
        ["Runtime checks", "Missing tables show unavailable, not fake zeroes. Preserve that honesty."],
        ["Production is additive", "Each Record now adds units. Re-entry double-counts. No bake-sheet waste yet."]
      ], cols: 2 },

      { ch: "04 Workday", dark: true, kicker: "Chapter 04", title: "The workday spine", lead: "Four manager screens look at the same date. They do different jobs. Do not merge them." },
      { ch: "04 Workday", kicker: "Map", title: "Four doors, one date", extra: `<table>
        <tr><th>Screen</th><th>Job</th><th>Usage</th></tr>
        <tr><td>Bakery Manager</td><td>Command workspace: scorecard, exceptions, drivers, production/pack handoff, recovery</td><td>Everyday</td></tr>
        <tr><td>Daily Run</td><td>Eight-stage checklist and the only official day closeout</td><td>Everyday</td></tr>
        <tr><td>Daily Brief</td><td>Printable shift handoff: what changed, what to make, who is driving</td><td>Everyday</td></tr>
        <tr><td>Operations Dashboard</td><td>Six-stage strip, severity-sorted exceptions, tomorrow readiness</td><td>Everyday</td></tr>
      </table>` },

      { ch: "04 Workday", kicker: "Walkthrough", title: "Bakery Manager", who: "Manager / administrator · manager.php", steps: [
        ["Pick the operating date.", "Yesterday / today / tomorrow. Everything on the page is scoped to that date."],
        ["Read the scorecard.", "Orders ready, routes assigned, driver progress, closeout risk. These are signals, not a second database."],
        ["Work the attention queue.", "Critical → warning → info. Each item deep-links to the canonical screen with filters pre-applied and a return path."],
        ["Watch the driver board.", "Per-driver stop states. Open My Route or Route Manager for a specific driver."],
        ["Use production and pack as handoff, not editors.", "Plan vs demand vs produced, shared pack check-offs, last baker activity."],
        ["On a wide desktop, open the exception workshop.", "Filter, group, bulk-assign, bulk-complete. Completing work never hides a still-true fact."]
      ], rule: "Bakery Manager does not impersonate a driver and does not change permissions. It points at established workflows." },

      { ch: "04 Workday", kicker: "Daily Run", title: "Eight gated stages", extra: `<table>
        <tr><th>#</th><th>Stage</th><th>Complete when</th><th>Opens</th></tr>
        <tr><td>1</td><td>Confirm Demand</td><td>Dated orders exist and a manager has confirmed; reopens if demand drifts after confirm</td><td>Daily Orders / Confirm on this page</td></tr>
        <tr><td>2</td><td>Commit Production Plan</td><td>Production Center has coverage for required products</td><td>Production Center</td></tr>
        <tr><td>3</td><td>Produce</td><td>Finished-goods produced_quantity covers demand</td><td>Daily Production</td></tr>
        <tr><td>4</td><td>Pack</td><td>Pack lines exist and finished goods are not short</td><td>Pack List</td></tr>
        <tr><td>5</td><td>Assign / Load / Dispatch</td><td>No unassigned orders; loads complete</td><td>Driver Assignment / Driver Loads</td></tr>
        <tr><td>6</td><td>Deliver &amp; Reconcile</td><td>Stops delivered, no failed open, routes closed out</td><td>My Route / Route Closeout</td></tr>
        <tr><td>7</td><td>Invoice</td><td>Confirmed deliveries marked invoiced</td><td>Billing Center</td></tr>
        <tr><td>8</td><td>Close the Day</td><td>Stages 1–7 complete, no critical/warning blockers</td><td>This page</td></tr>
      </table>` },
      { ch: "04 Workday", kicker: "Walkthrough", title: "Run and close one day", who: "Manager · daily_run.php", steps: [
        ["Open Daily Run for the date.", "First view lazy-generates missing dated orders and preserves existing quantity edits."],
        ["Clear stage blockers in order.", "Each stage shows metrics, a summary, and a deep link. Confirm Demand hard-gates closeout."],
        ["If demand changes after confirmation, confirm again.", "operational_events records the drift. The stage reopens on purpose."],
        ["Close only when the page says ready.", "Closeout refuses while blockers exist. A note is optional. Reopen is allowed."],
        ["A closed day can go stale.", "If new exceptions appear after close, the UI says so. Completing paperwork never hides operations."]
      ], rule: "Daily Run is the spine. Strengthen stages. Do not route around it." },

      { ch: "04 Workday", kicker: "Walkthrough", title: "Daily Brief", who: "Manager · daily_brief.php", steps: [
        ["Choose the date and read the mode.", "The brief is deterministic from live data: planning, in-progress, or handoff."],
        ["Scan important changes.", "Dated quantities that moved enough versus standing (absolute and relative thresholds)."],
        ["Check production, ingredient alerts, and driver load.", "Same command-center numbers, written for a shift change."],
        ["Print if needed.", "?print=1 opens a one-page handoff. It does not create a second plan."]
      ], rule: "The brief never invents lifecycle fields. It reuses dashboard, demand review, and Daily Run." },

      { ch: "04 Workday", kicker: "Walkthrough", title: "Operations Dashboard", who: "Manager · index.php", steps: [
        ["Read the six-stage strip.", "Demand, production, pack, load, delivery, invoice. States: on track, attention, empty, unavailable."],
        ["Work exceptions, not charts.", "Severity-sorted. Inline generate / confirm actions where they belong."],
        ["Check tomorrow readiness.", "A strip for the next date: generated? confirmable? already confirmed?"],
        ["Bakers who land here are sent toward production.", "Drivers never stay here — they are redirected to My Route."]
      ], rule: "Zero means zero. Unavailable means the table or query is missing. Do not collapse those." },

      { ch: "05 Demand", dark: true, kicker: "Chapter 05", title: "Orders and demand", lead: "Standing is how the bakery thinks. Dated is what it committed to bake and deliver." },
      { ch: "05 Demand", kicker: "Model", title: "How demand is computed", items: [
        "All consumption goes through bakery_operating_demand_* helpers — never raw table sums.",
        "Per customer: dated order wins; else standing forecast; pauses and skips respected.",
        "Pan Dulce standards can fill routed customers who have no other order.",
        "Generation runs from Daily Orders (one date or Generate week), Daily Run / dashboard inline action, lazy first view, or route build from standing.",
        "There is still no background scheduler. Someone or a first view must open the date."
      ]},
      { ch: "05 Demand", kicker: "Walkthrough", title: "Daily Orders", who: "Order manager · daily_orders.php", steps: [
        ["Select the date.", "The review shows expected customers, dated vs standing, missing, empty, and intentional changes."],
        ["Preview generate, then generate.", "Creates dated orders from standing. Does not overwrite changed quantities unless you opt in."],
        ["Edit a customer’s dated lines.", "That edit is the commercial commitment for that date only. It does not write standing."],
        ["Use review filters from exceptions.", "missing, empty, differences. Situation chips mark implicated rows."],
        ["Generate week when planning ahead.", "Same preservation rules, seven dates at a time."]
      ], rule: "Portal customers editing an ungenerated date auto-create the dated order from standing. Staff and portal share the same mutation helpers." },
      { ch: "05 Demand", kicker: "Walkthrough", title: "Standing Orders", who: "Order manager · standing_orders_manager.php", steps: [
        ["Find a customer and a weekday.", "Sunday is 7. Grid of products × days."],
        ["Set quantities.", "Zero deletes the standing line. This is the weekly template, not today’s invoice."],
        ["Respect origin.", "Synthetic SF Bakers cannot receive standing orders."],
        ["Do not expect past dated orders to change.", "Standing edits never rewrite history."]
      ], rule: "standing_orders.php is the older editor. The manager page is canonical." },
      { ch: "05 Demand", kicker: "Pan Dulce", title: "Standards that fill the route", cards: [
        ["Pan Dulce Standards", "Default quantities by customer or route when a routed customer has no other order for the date."],
        ["Pan Dulce Pricing", "Zone-specific prices. A customer can also have a default Pan Dulce price."],
        ["Why it exists", "Many café stops take a standard sweet-bread mix. Staff should not retype it every day."],
        ["Still dated-first", "If that customer has a dated order, the dated order wins."]
      ], cols: 2 },

      { ch: "06 Customers", dark: true, kicker: "Chapter 06", title: "Customers", lead: "One hub to find a customer. Specialized screens still own the edits." },
      { ch: "06 Customers", kicker: "Walkthrough", title: "Customers list", who: "Manager · customers.php", steps: [
        ["Search name, phone, email, zone, or address.", "Enter opens the matching record when the list is tight."],
        ["Create or edit contact and delivery windows.", "Zone, deliver-after / deliver-by, pricing tier, payment collection, portal code, SF Baker flag."],
        ["Activate or deactivate.", "Inactive customers never generate dated demand."],
        ["Jump to the hub for the full picture.", "Do not rebuild standing, pricing, or billing editors on this list."]
      ]},
      { ch: "06 Customers", kicker: "Walkthrough", title: "Customer Hub", who: "Manager · customer_record.php", steps: [
        ["Pick a customer and a date.", "Default date is tomorrow — the next bake/delivery horizon."],
        ["Read summaries, do not re-edit here.", "Standing pattern, today’s dated order, route, pricing, billing, issues, timeline."],
        ["Follow the deep links.", "Each section jumps to the specialized screen with return= back to the hub."],
        ["Use it as orientation.", "High-frequency name surfaces across the OS already link here."]
      ], rule: "The hub is findability. Mutations stay on Daily Orders, Standing Orders, pricing pages, Billing Center, and Service Issues." },
      { ch: "06 Customers", kicker: "Walkthrough", title: "Schedule, zones, pricing, leads", who: "Manager", steps: [
        ["Customer Schedule: set delivery days and windows; change zone inline.", "This is who gets a truck on which weekday."],
        ["Delivery Zones: create and name zones.", "This table is the source of truth. Map.php’s hardcoded list is not."],

      { ch: "16 Full day", kicker: "Evening", title: "Close and hand off", steps: [
        ["Daily Run stage 8: Close the Day.", "Refuses if any warning/critical blocker remains."],
        ["Print Daily Brief for the next shift.", "Changes, leftover production, tomorrow readiness."],
        ["Customers pause next week or edit still-open dates in the portal.", "Those edits become tomorrow’s demand."],
        ["If something is still true and wrong, it stays visible.", "A completed exception task is not a green day."]
      ]},

      { ch: "17 Status", dark: true, kicker: "Chapter 17", title: "What is closed, what is not", lead: "An executive deck that only celebrates screens would be dishonest. The OS is a spine with a few open joints." },
      { ch: "17 Status", kicker: "Closed loops", title: "These already carry the next role", cards: [
        ["Demand confirm", "Generation + is_active + confirm table + hard-gate + drift reopen + tomorrow strip."],
        ["Driver confirm", "Photo, snapshot prices, COD, notify customer, assistant pairing, camera/CSRF resilience."],
        ["Route closeout", "Loaded vs delivered vs returned vs waste; gates day close."],
        ["Exception coordination", "Work queue + workshop + desk + failed-stop recovery. Facts stay live."]
      ], cols: 2 },
      { ch: "17 Status", kicker: "Open loops", title: "The current product work", items: [
        "No background demand scheduler — first view or a click still starts generation.",
        "Production Center saves targets; the baker still bakes to demand. No commit/lock, no post-plan drift flags.",
        "Production confirm is additive; bake-sheet waste is missing; credits are not auto-returned to FG.",
        "Billing mark is still essentially one-order; no canonical customer send; legacy invoice scripts remain dangerous.",
        "Customer editing is still split across specialized screens; the hub is orientation only.",
        "Staff are not pinged. Overlapping route screens remain. product_distribution.php still lies about dated-vs-standing."
      ]},
      { ch: "17 Status", kicker: "Roadmap", title: "Agreed direction — reconfirm before jumping ahead", extra: `<table>
        <tr><th>#</th><th>Work</th><th>State</th></tr>
        <tr><td>1</td><td>Tomorrow, Confirmed</td><td>Mostly shipped; optional cron still open</td></tr>
        <tr><td>2</td><td>Production-plan integration (commit → baker)</td><td>Next real product loop</td></tr>
        <tr><td>3</td><td>Route closeout</td><td>Shipped</td></tr>
        <tr><td>4</td><td>Canonical bulk invoicing + send</td><td>Open</td></tr>
        <tr><td>5</td><td>Customer hub findability</td><td>Hub shipped; editors stay specialized</td></tr>
        <tr><td>6</td><td>Usability: bulk actions, inline edits, known broken windows</td><td>Ongoing</td></tr>
      </table><p class="callout">Deferred on purpose: balances/aging, production variance intelligence, offline driver confirm, framework rewrites, generalized security programs.</p>` },

      { ch: "Close", dark: true, kicker: "Sour Flour OS", title: "Look at one date. Do the next thing. Leave a record.", lead: "That is the whole product. Every screen in this deck exists to make that sentence true for a real bakery tomorrow morning.", extra: '<p class="title-meta">Open this file in a browser · Arrow keys to present · O for chapters · Print for PDF<br>docs/executive-slide-deck.html · Product manual: BAKERY_PRODUCT_CONTEXT.md</p>' }
    ];

    const deck = document.getElementById("deck");
    const overview = document.getElementById("overview");
    const countEl = document.getElementById("count");
    const chapterEl = document.getElementById("chapterLabel");
    const bar = document.querySelector("#progress i");
    let i = 0;

    function renderSlide(s, idx) {
      const el = document.createElement("section");
      el.className = "slide" + (s.dark ? " dark" : "");
      el.dataset.i = idx;
      let html = "";
      if (s.kicker) html += `<p class="kicker">${s.kicker}</p>`;
      if (s.who) html += `<p class="who">${s.who}</p>`;
      const heading = (s.dark && !s.items && !s.cards && !s.steps) ? "h1" : "h2";
      html += s.title ? `<${heading}>${s.title}</${heading}>` : "";
      if (s.lead) html += `<p class="lead">${s.lead}</p>`;
      if (s.items) html += `<ul class="bullets">${s.items.map(x => `<li>${x}</li>`).join("")}</ul>`;
      if (s.cards) {
        const cols = s.cols === 2 ? "g2" : s.cols === 4 ? "g4" : "g3";
        html += `<div class="grid ${cols}">${s.cards.map(c => `<article class="card"><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join("")}</div>`;
      }
      if (s.steps) {
        html += `<div class="steps">${s.steps.map(st => `<div class="step"><div><strong>${st[0]}</strong><span>${st[1]}</span></div></div>`).join("")}</div>`;
      }
      if (s.extra) html += s.extra;
      if (s.callout) html += `<div class="callout">${s.callout}</div>`;
      if (s.rule) html += `<p class="rule">${s.rule}</p>`;
      el.innerHTML = html;
      return el;
    }

    S.forEach((s, idx) => deck.appendChild(renderSlide(s, idx)));

    function show(n) {
      i = Math.max(0, Math.min(S.length - 1, n));
      deck.querySelectorAll(".slide").forEach((el, idx) => el.classList.toggle("is-on", idx === i));
      countEl.textContent = (i + 1) + " / " + S.length;
      chapterEl.textContent = S[i].ch;
      bar.style.width = ((i + 1) / S.length * 100) + "%";
      location.hash = String(i + 1);
    }

    function buildOverview() {
      const groups = {};
      S.forEach((s, idx) => {
        groups[s.ch] = groups[s.ch] || [];
        groups[s.ch].push({ idx, title: s.title || s.kicker });
      });
      overview.innerHTML = "<h2>Chapters</h2>" + Object.keys(groups).map(ch => {
        return `<h3 style="margin:22px 0 8px;font-size:16px;color:#ffe0a5">${ch}</h3><div class="ov-grid">${
          groups[ch].map(x => `<div class="ov-item" data-go="${x.idx}"><small>${x.idx + 1}</small><b>${x.title}</b></div>`).join("")
        }</div>`;
      }).join("");
    }
    buildOverview();

    document.getElementById("chrome").addEventListener("click", (e) => {
      const act = e.target.getAttribute("data-act");
      if (act === "prev") show(i - 1);
      if (act === "next") show(i + 1);
      if (act === "overview") overview.classList.toggle("is-on");
    });
    overview.addEventListener("click", (e) => {
      const go = e.target.closest("[data-go]");
      if (go) { overview.classList.remove("is-on"); show(Number(go.getAttribute("data-go"))); }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(i + 1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(S.length - 1);
      if (e.key === "o" || e.key === "O") overview.classList.toggle("is-on");
      if (e.key === "Escape") overview.classList.remove("is-on");
      if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen();
      }
    });
    let touchX = null;
    document.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener("touchend", (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].screenX - touchX;
      if (dx < -40) show(i + 1);
      if (dx > 40) show(i - 1);
      touchX = null;
    }, { passive: true });

    const fromHash = parseInt((location.hash || "").replace("#", ""), 10);
    show(Number.isFinite(fromHash) && fromHash > 0 ? fromHash - 1 : 0);
  </script>
</body>
</html>
