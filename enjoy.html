<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enjoy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a2e24;
      --foam: #f3f7f2;
      --leaf: #3d6b4f;
      --sun: #e8c46a;
      --mist: rgba(243, 247, 242, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--foam);
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(232, 196, 106, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 75%, rgba(61, 107, 79, 0.55), transparent 50%),
        linear-gradient(160deg, #0f1f18 0%, #1f3d2e 45%, #243a2c 100%);
      overflow: hidden;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 30% 40%, rgba(243, 247, 242, 0.06) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 60%, rgba(232, 196, 106, 0.08) 0 1px, transparent 1.5px);
      background-size: 48px 48px, 72px 72px;
      animation: drift 28s linear infinite;
      pointer-events: none;
    }

    .brand {
      position: relative;
      font-family: "Fraunces", serif;
      font-optical-sizing: auto;
      font-weight: 700;
      font-size: clamp(4.5rem, 18vw, 11rem);
      letter-spacing: -0.04em;
      line-height: 0.9;
      color: var(--foam);
      text-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .tagline {
      position: relative;
      margin-top: 1.25rem;
      max-width: 22rem;
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--mist);
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }

    .cta {
      position: relative;
      margin-top: 2rem;
      display: inline-block;
      padding: 0.85rem 1.6rem;
      border: 1px solid rgba(243, 247, 242, 0.35);
      background: rgba(26, 46, 36, 0.35);
      color: var(--foam);
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
    }

    .cta:hover {
      border-color: var(--sun);
      background: rgba(61, 107, 79, 0.45);
      transform: translateY(-2px);
    }

    .glow {
      position: absolute;
      width: min(42vw, 18rem);
      height: min(42vw, 18rem);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232, 196, 106, 0.22), transparent 70%);
      filter: blur(8px);
      animation: pulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(1.25rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-24px, 18px, 0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <main class="scene">
    <span class="glow" aria-hidden="true"></span>
    <div>
      <h1 class="brand">enjoy</h1>
      <p class="tagline">A quiet sample page for a single word and a little atmosphere.</p>
      <a class="cta" href="#">Stay a moment</a>
    </div>
  </main>
</body>
</html>
